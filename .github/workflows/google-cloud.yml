name: Furnique CI and Google Cloud deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      approve_public_deploy:
        description: "Owner has approved a public demo deployment and reviewed billing"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check browser scripts
        run: |
          node --check app.js
          node --check pages.js
      - name: Verify Java application
        run: mvn --batch-mode -f java-app/pom.xml clean verify

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.approve_public_deploy == true
    needs: test
    runs-on: ubuntu-latest
    environment: furnique-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Build and push container
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
        run: |
          set -euo pipefail
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --file java-app/Dockerfile --tag "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Deploy demo service
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          image: ${{ env.IMAGE }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          env_vars: |-
            DB_URL=jdbc:postgresql:///furnique?cloudSqlInstance=${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
            DB_USER=${{ vars.DB_USER }}
            GCS_BUCKET=${{ vars.GCS_BUCKET }}
            ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }}
            COOKIE_SECURE=true
          secrets: |-
            DB_PASSWORD=${{ vars.DB_PASSWORD_SECRET_NAME }}:latest
            ADMIN_API_TOKEN=${{ vars.ADMIN_TOKEN_SECRET_NAME }}:latest
            ADMIN_PASSWORD=${{ vars.ADMIN_PASSWORD_SECRET_NAME }}:latest
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
            --max=1
