<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#34372f">
    <meta name="description" content="Secure Furnique Studio administrator workspace.">
    <title>Studio workspace — Furnique Studio</title>
    <link rel="stylesheet" href="auth.css">
    <script src="auth.js" defer></script>
  </head>
  <body class="admin-auth-page">
    <main class="account-shell admin-shell">
      <header class="account-header"><a class="auth-brand" href="index.html">Furnique<span>Studio</span></a><button class="auth-secondary" type="button" data-sign-out>Sign out</button></header>
      <section class="admin-dashboard">
        <span class="auth-eyebrow">PRIVATE WORKSPACE</span>
        <h1>Studio orders</h1>
        <p id="admin-welcome" class="auth-intro">Checking administrator access…</p>
        <p id="admin-message" class="auth-message" role="status" aria-live="polite"></p>
        <div class="admin-orders-wrap">
          <table class="admin-orders">
            <thead><tr><th>Order</th><th>Customer</th><th>Email</th><th>Total</th><th>Status</th></tr></thead>
            <tbody id="admin-orders"><tr><td colspan="5">Loading secure orders…</td></tr></tbody>
          </table>
        </div>
        <p class="account-note">Orders are prototype/test orders. Product inventory and the storefront demo admin tools are not yet connected to this secure workspace.</p>
      </section>
    </main>
  </body>
</html>
