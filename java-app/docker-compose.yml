services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: furnique
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a local-only DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d furnique"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  storage:
    image: fsouza/fake-gcs-server:1.52.0
    command: ["-scheme", "http", "-port", "4443"]

  app:
    build:
      context: ..
      dockerfile: java-app/Dockerfile
    depends_on:
      database:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      PORT: "8080"
      DB_URL: jdbc:postgresql://database:5432/furnique
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set a local-only DB_PASSWORD in .env}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set a local-only admin token in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set a local-only admin email in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a local-only admin password in .env}
      COOKIE_SECURE: "false"
      GCS_BUCKET: furnique-backups
      STORAGE_EMULATOR_HOST: http://storage:4443
      BACKUP_DIRECTORY: /app/data/backups
    ports:
      - "8080:8080"
    volumes:
      - app-data:/app/data

volumes:
  postgres-data:
  app-data:
